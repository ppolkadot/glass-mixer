name: Rust CI

# Runs on pushes to the long-lived branches and on every pull request, so a
# PR into main (or any other branch) is always validated. Run it by hand from
# the Actions tab with "Run workflow" when needed.
on:
  push:
    branches: [main, experiments, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref makes the older run redundant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $errors = $null
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) { throw "Syntax error in $($_.Name): $errors" }
          }
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      # Hardware, desktop-input and global-shortcut tests are #[ignore]d and do
      # not run here (see docs/TESTING.md).
      - name: Test
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Third-party notices
        shell: pwsh
        run: ./scripts/third-party-notices.ps1 -OutFile target/THIRD-PARTY-NOTICES.txt

  # The oldest Rust that Cargo.toml's `rust-version` promises must still build it.
  msrv:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
      - name: Check with Rust 1.95
        run: cargo check --locked --all-targets

  # RustSec advisories for everything in Cargo.lock. Fails on vulnerabilities;
  # unmaintained or yanked crates are reported as warnings.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit dependencies
        run: cargo audit
