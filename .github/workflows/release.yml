name: Release

# Builds, tests, packages and verifies a release, then leaves it as a DRAFT GitHub
# release for review. Nothing is published automatically.
#
# Start it by pushing a version tag that matches Cargo.toml:
#   git tag v0.5.0 && git push origin v0.5.0
# or run it by hand for a dry run, which builds and uploads the packages but creates
# no release. Signing is optional; see docs/RELEASING.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.notes.outputs.version }}
    env:
      # Optional Authenticode signing. Without the secrets the build is unsigned, and
      # the release notes say so. Never commit a certificate or its password.
      SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
      GLASS_MIXER_SIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGN_TIMESTAMP_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # The tag, Cargo.toml, Cargo.lock, the manifest, the installer and the changelog
      # must all name the same version, and the changelog may have no Unreleased section.
      - name: Version consistency
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { ./scripts/check-version.ps1 -Tag $env:GITHUB_REF_NAME } else { ./scripts/check-version.ps1 }
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }

      - name: Import the code-signing certificate
        if: ${{ env.SIGN_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          try {
            $password = ConvertTo-SecureString $env:SIGN_PFX_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          } finally {
            Remove-Item $pfx -Force
          }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { throw 'signtool.exe was not found in the Windows SDK.' }
          "GLASS_MIXER_SIGN_CERT_SHA1=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GLASS_MIXER_SIGNTOOL=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SIGNED=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Builds the release exe, the portable ZIP and the installer, signs them when a
      # certificate was imported, then verifies them and writes SHA256SUMS.txt.
      - name: Package and verify
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Require the installer (and the signature, when signing)
        shell: pwsh
        run: |
          if ($env:SIGNED -eq 'true') { ./scripts/verify-package.ps1 -RequireInstaller -RequireSigned } else { ./scripts/verify-package.ps1 -RequireInstaller }
      - name: Release notes
        id: notes
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($env:SIGNED -eq 'true') { ./scripts/release-notes.ps1 -Version $version -OutFile dist/release-notes.md -Signed } else { ./scripts/release-notes.ps1 -Version $version -OutFile dist/release-notes.md }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glass-mixer-${{ env.VERSION }}
          path: |
            dist/glass-mixer-${{ env.VERSION }}-portable.zip
            dist/glass-mixer-${{ env.VERSION }}-setup.exe
            dist/glass-mixer-${{ env.VERSION }}-SHA256SUMS.txt
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 30

      - name: Remove the certificate from the runner
        if: ${{ always() && env.SIGN_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          if ($env:GLASS_MIXER_SIGN_CERT_SHA1) { Remove-Item "Cert:\CurrentUser\My\$env:GLASS_MIXER_SIGN_CERT_SHA1" -Force -ErrorAction SilentlyContinue }

  # A draft: review it, then publish it from the GitHub Releases page.
  publish:
    needs: build
    if: ${{ github.ref_type == 'tag' }}
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write # creates the draft release
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: glass-mixer-${{ needs.build.outputs.version }}
          path: dist
      - name: Draft release
        shell: pwsh
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "A release for $env:GITHUB_REF_NAME already exists; leaving it as it is."
            exit 0
          }
          gh release create $env:GITHUB_REF_NAME `
            "dist/glass-mixer-$env:VERSION-portable.zip" `
            "dist/glass-mixer-$env:VERSION-setup.exe" `
            "dist/glass-mixer-$env:VERSION-SHA256SUMS.txt" `
            --draft --title "Glass Mixer $env:VERSION" --notes-file dist/release-notes.md
